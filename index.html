<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f3a41">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vuelco">
<script src="config.js"></script>
</head><body>
<title>Vuelco</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: one-thumb mobile game — status bar (lives, coins, stars), four tabs (map, town, rewards, shop) over a bottom nav; a level opens full-screen. Single committed look: deep lagoon night with candy-jelly accents. */
:root{
  --bg:#0a2a2f; --panel:#123c43; --panel2:#184a52; --line:#24606a;
  --chalk:#effaf8; --muted:#9cc7c4; --gold:#ffc23d; --gold2:#d99a00; --coral:#ff6b5b; --mint:#3fd6a2; --sky:#56a9ff; --heart:#ff5c7a;
  --display:"Titan One","Trebuchet MS",system-ui,sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--chalk);font-family:var(--body);margin:0;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font:inherit;cursor:pointer;border-radius:14px;border:0;padding:11px 16px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:inherit;background:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
.b-pri{background:var(--gold);color:#2a1a00}
.b-sec{background:transparent;color:var(--chalk);border:1.5px solid var(--line)}
.b-ad{background:var(--mint);color:#06281a}
.b-ad svg,.b-pri svg{width:14px;height:14px}
.coin{display:inline-block;width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe58a,var(--gold) 55%,var(--gold2));box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);flex:none;vertical-align:-2px}
.coin.lg{width:24px;height:24px}
.star{width:15px;height:15px;color:var(--gold);flex:none;vertical-align:-2px}
.wrap{max-width:460px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}

/* status bar */
.status{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.status .wrap{display:flex;align-items:center;gap:6px;padding-block:8px}
.pill{display:flex;align-items:center;gap:6px;background:var(--panel);border:1.5px solid var(--line);border-radius:999px;padding:5px 10px;font-family:var(--display);font-size:1rem;font-variant-numeric:tabular-nums;min-width:0}
.pill small{font-family:var(--body);font-weight:800;font-size:.7rem;color:var(--muted)}
.pill .plus{width:22px;height:22px;border-radius:50%;background:var(--mint);color:#06281a;padding:0;font-size:1rem;margin-right:-4px}
.pill svg{width:18px;height:18px}
.status .sp{flex:1}
.gear{width:38px;height:38px;border-radius:50%;padding:0;background:var(--panel);border:1.5px solid var(--line)}
.gear svg{width:20px;height:20px}

/* tabs */
main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#082226;border-top:1.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-block:6px}
.nav button{flex-direction:column;gap:3px;padding:6px 2px;font-size:.72rem;color:var(--muted);border-radius:14px;position:relative}
.nav button svg{width:26px;height:26px}
.nav button.on{color:var(--chalk);background:var(--panel)}
.nav .dot{position:absolute;top:4px;right:calc(50% - 20px);width:10px;height:10px;border-radius:50%;background:var(--heart);box-shadow:0 0 0 2px #082226}

/* map */
.chap{margin:26px 0 12px;border-radius:18px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border:1.5px solid var(--line)}
.chap b{font-family:var(--display);font-weight:400;font-size:1.15rem}
.chap span{font-size:.75rem;font-weight:800;color:var(--muted)}
.chap .num{font-family:var(--display);font-size:.8rem;opacity:.75}
.path{display:flex;flex-direction:column;align-items:center;gap:14px}
.node{width:62px;height:62px;border-radius:50%;padding:0;font-family:var(--display);font-size:1.25rem;flex-direction:column;gap:0;position:relative;background:var(--panel2);border:3px solid var(--line);color:var(--muted)}
.node.done{background:var(--mint);border-color:#1f9e74;color:#06281a}
.node.cur{background:var(--gold);border-color:var(--gold2);color:#2a1a00;width:74px;height:74px;font-size:1.45rem;box-shadow:0 0 0 6px rgba(255,194,61,.22)}
.node.boss{border-radius:22px}
.node .ns{position:absolute;bottom:-10px;display:flex;gap:1px}
.node .ns svg{width:15px;height:15px;color:rgba(0,0,0,.25)}
.node .ns svg.on{color:var(--gold);filter:drop-shadow(0 1px 0 rgba(0,0,0,.4))}
.node .tag{position:absolute;top:-8px;right:-14px;font-family:var(--body);font-size:.6rem;font-weight:800;background:var(--coral);color:#fff;border-radius:6px;padding:2px 5px}
@media (prefers-reduced-motion: no-preference){.node.cur{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-5px)}}}

/* town */
.town{display:flex;flex-direction:column;gap:12px;padding-block:6px 20px}
.t3d{position:relative;border-radius:22px;overflow:hidden;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.15)}
.t3d canvas{display:block;width:100%;aspect-ratio:4/3;touch-action:pan-y}
.t3dh{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(10,42,47,.55);color:#fff;font-size:.7rem;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap;pointer-events:none}
.thead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.thead h2{font-family:var(--display);font-weight:400;font-size:1.35rem;margin:0}
.thead button{width:36px;height:36px;padding:0;border-radius:50%;background:var(--panel);border:1.5px solid var(--line)}
.tlist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.titem{flex-direction:column;gap:4px;background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:10px 4px;font-size:.74rem;min-width:0}
.titem b{font-size:.8rem}
.titem.built{border-color:var(--mint);opacity:.75}.titem.built.ready{opacity:1;border-color:var(--gold)}
.titem.next{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,194,61,.18)}
.bar{height:10px;border-radius:5px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--mint),var(--gold))}

/* rewards */
.rew{display:flex;flex-direction:column;gap:12px;padding-block:6px 20px}
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rtile{flex-direction:column;gap:6px;background:var(--panel);border:1.5px solid var(--line);border-radius:20px;padding:14px 8px;position:relative;min-width:0}
.rtile canvas{width:56px;height:56px}
.rtile b{font-size:.9rem}
.rtile small{font-size:.72rem;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.rtile.ready{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,194,61,.18)}
.rtile.ready small{color:var(--gold)}
.rtile.wide{grid-column:1/-1;flex-direction:row;justify-content:flex-start;text-align:left;gap:12px;padding:14px}
.rtile.wide>div{display:flex;flex-direction:column;gap:3px;min-width:0}
.rtile .dot{position:absolute;top:10px;right:12px;width:10px;height:10px;border-radius:50%;background:var(--heart)}
.sec{font-family:var(--display);font-weight:400;font-size:1.1rem;margin:6px 0 0}
.chests{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{flex-direction:column;gap:2px;background:var(--panel);border:1.5px dashed var(--line);border-radius:16px;padding:6px 2px 8px;min-width:0}
.slot canvas{width:64px;height:64px}
.slot small{font-size:.68rem;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.slot.full{border-style:solid}.slot.ready{border-color:var(--gold)}.slot.ready small{color:var(--gold)}.slot.run small{color:var(--sky)}.slot.empty canvas{opacity:.2}

/* shop */
.shop{display:flex;flex-direction:column;gap:10px;padding-block:6px 20px}
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sitem{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:12px 8px;text-align:center;min-width:0;position:relative}
.sitem canvas{width:76px;height:76px}
.sitem b{font-size:.88rem;line-height:1.15}
.sitem .rar{font-size:.62rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.sitem p{margin:0;font-size:.72rem;color:var(--muted);line-height:1.3}
.sitem button{width:100%;padding:8px 6px;font-size:.82rem}
.sitem .off{position:absolute;top:8px;right:8px;background:var(--coral);color:#fff;font-size:.66rem;font-weight:800;border-radius:6px;padding:2px 6px}
.sitem .own{position:absolute;top:8px;left:8px;background:var(--panel2);font-size:.7rem;font-weight:800;border-radius:6px;padding:2px 6px}

/* play */
#play{min-height:100%;display:flex;flex-direction:column}
.ptop{display:flex;align-items:center;gap:8px;padding-block:8px 6px}
.back{width:40px;height:40px;border-radius:50%;padding:0;background:rgba(255,255,255,.1)}
.back svg{width:22px;height:22px}
.goals{flex:1;min-width:0;display:flex;gap:6px;flex-wrap:wrap}
.goal{display:flex;align-items:center;gap:5px;background:var(--panel);border-radius:12px;padding:4px 8px 4px 4px;font-family:var(--display);font-size:1rem;font-variant-numeric:tabular-nums}
.goal canvas{width:26px;height:26px}
.goal.ok{background:#1f9e74}
.turns{display:flex;flex-direction:column;align-items:center;background:var(--panel);border-radius:14px;padding:4px 12px;line-height:1}
.turns small{font-size:.6rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.turns b{font-family:var(--display);font-weight:400;font-size:1.6rem;color:var(--gold)}
.turns.low b{color:var(--coral)}
.pinfo{display:flex;justify-content:space-between;font-size:.74rem;font-weight:800;color:var(--muted);padding-bottom:6px}
#cv{display:block;width:100%;touch-action:none}
.ctrl{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.rot{width:66px;height:66px;border-radius:50%;padding:0;background:var(--panel);border:2.5px solid var(--line);flex:none;position:relative}
.rot svg{width:32px;height:32px}
.rot:active{transform:scale(.94)}
.boost{display:flex;gap:8px}
.bst{width:52px;height:52px;border-radius:16px;padding:0;background:var(--panel2);border:2px solid var(--line);position:relative}
.bst canvas{width:34px;height:34px}
.bst .n{position:absolute;bottom:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--gold);color:#2a1a00;font-size:.7rem;font-weight:800;display:grid;place-items:center;padding:0 4px}
.bst .n.buy{background:var(--mint);color:#06281a}
.bst.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,194,61,.3)}
.hint{margin:10px 0 0;font-size:.82rem;color:var(--muted);text-align:center;line-height:1.4;text-wrap:balance;min-height:2.3em}
.coach{position:absolute;pointer-events:none;z-index:4;display:flex;flex-direction:column;align-items:center;gap:6px}
.coach span{background:var(--gold);color:#2a1a00;font-weight:800;font-size:.85rem;border-radius:12px;padding:8px 12px;max-width:220px;text-align:center}
.coach i{width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:16px solid var(--gold)}
@media (prefers-reduced-motion: no-preference){.coach{animation:bob 1s ease-in-out infinite}}
@media (prefers-reduced-motion: reduce){.rot:active{transform:none}}

/* overlays */
.ov{position:fixed;inset:0;background:rgba(3,16,19,.8);display:grid;place-items:center;z-index:20;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:24px;padding:22px 20px;width:min(350px,100%);max-height:calc(100vh - 32px);overflow:auto;display:flex;flex-direction:column;gap:12px;text-align:center}
.card h2{font-family:var(--display);font-weight:400;font-size:1.6rem;margin:0;text-wrap:balance;line-height:1.1}
.card p{margin:0;color:var(--muted);line-height:1.45}
.card .big{font-family:var(--display);font-size:2.3rem;line-height:1;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--gold)}
.card .btns{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.card .stars{display:flex;justify-content:center;gap:4px}
.card .stars svg{width:46px;height:46px;color:var(--line)}
.card .stars svg:nth-child(2){width:56px;height:56px;margin-top:-8px}
.card .stars svg.on{color:var(--gold)}
.card ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px;text-align:left;font-size:.88rem;color:var(--muted)}
.card li{display:flex;gap:10px;align-items:center}
.card li canvas{width:34px;height:34px;flex:none}
.card .gl{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.card .gl .goal{font-size:1.1rem}
.cal{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cal div{background:var(--panel2);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.7rem;font-weight:800;color:var(--muted)}
.cal div canvas{width:28px;height:28px}
.cal div b{font-family:var(--display);font-weight:400;font-size:.95rem;color:var(--chalk)}
.cal div.done{opacity:.4}.cal div.today{background:var(--gold);color:#2a1a00}.cal div.today b{color:#2a1a00}
.cal div:last-child{grid-column:span 2}
.mis{display:flex;flex-direction:column;gap:10px;text-align:left}
.mis div{background:var(--panel2);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.mis div b{font-size:.88rem}
.mis .pb{grid-column:1;height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.mis .pb i{display:block;height:100%;background:var(--mint)}
.mis button{grid-row:1/3;grid-column:2;padding:8px 12px;font-size:.8rem}
.wheelbox{position:relative;width:min(270px,100%);margin:0 auto}
.wheelbox canvas{width:100%;display:block}
.wheelbox .ptr{position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:24px solid var(--gold)}
.chestfx{width:200px;height:170px;margin:0 auto}
.chestfx canvas{width:200px;height:170px;display:block}
.loot{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.loot div{display:flex;align-items:center;gap:8px;background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:8px;text-align:left;font-size:.8rem;font-weight:700;min-width:0}
.loot div canvas{width:34px;height:34px;flex:none}
.loot div{position:relative;border-style:dashed;animation:lootin .35s ease-out both}.loot .lok{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;background:var(--mint,#3fd6a2);color:#06302a;font-style:normal;font-size:.75rem;font-weight:900;display:grid;place-items:center}
@keyframes lootin{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.evban{display:block;width:100%;text-align:left;background:linear-gradient(135deg,#3b2a6b,#1d4b55);border:2px solid #b57bff;border-radius:16px;padding:10px 12px;margin:8px 0;color:var(--chalk)}.evban b{font-family:var(--display);font-weight:400;font-size:1rem;display:block}.evban small{display:block;font-size:.72rem;color:#d0bfff;margin:2px 0 6px}.evban .pb{display:block;height:8px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden}.evban .pb i{display:block;height:100%;background:#b57bff}
.stl{max-height:220px;overflow:auto;text-align:left}.stl div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:5px 0;font-size:.78rem}
.lockban{display:flex;flex-direction:column;gap:2px;background:rgba(255,194,61,.12);border:1.5px dashed var(--gold);border-radius:14px;padding:10px 12px;margin:8px 0;font-size:.8rem;color:var(--muted)}.lockban b{color:var(--gold);font-size:.9rem}
#t-shop.locked .sitem{opacity:.6}.chests.locked .slot{opacity:.5;filter:grayscale(.7)}
.rtile.locked{opacity:.5;filter:grayscale(.6)}.nav button.lock{opacity:.75}
.farmer{display:flex;gap:10px;align-items:flex-start;text-align:left}.farmer canvas{flex:none}.say{background:var(--panel2);border-radius:14px;padding:10px 12px;position:relative;font-size:.88rem}.say b{display:block;font-family:var(--display);font-weight:400;font-size:1.05rem;color:var(--chalk);margin-bottom:2px}.say span{display:block}
.farm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:8px 0}.farm div{background:var(--panel2);border-radius:12px;padding:6px;display:flex;flex-direction:column;align-items:center;font-size:.75rem}.farm small{font-size:.64rem;color:var(--muted)}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}.nav{padding-bottom:max(6px,env(safe-area-inset-bottom))}
.tperk{font-size:.68rem;font-weight:700;color:var(--muted);display:block;margin-top:2px}.titem.ready{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,194,61,.25)}.tsum{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:8px 0}.tsum span{background:var(--panel);border-radius:999px;padding:5px 10px;font-size:.75rem;font-weight:800}
.loot small{display:block;font-size:.6rem;text-transform:uppercase;letter-spacing:.06em}
.toggle{display:flex;align-items:center;justify-content:space-between;background:var(--panel2);border-radius:14px;padding:12px 14px;font-weight:700}
.toggle button{padding:6px 14px;font-size:.8rem}
.ad{background:#000;color:#fff}
.ad .box{width:min(340px,100%);aspect-ratio:9/14;max-height:80vh;border:2px dashed #555;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center}
.ad .tag{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:#aaa}
.ad .cnt{font-family:var(--display);font-size:3rem}
.ad button{background:#fff;color:#000}
.toast{position:fixed;left:50%;top:calc(60px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--gold);color:#2a1a00;font-weight:800;border-radius:999px;padding:9px 16px;z-index:40;display:flex;align-items:center;gap:6px;box-shadow:0 8px 24px rgba(0,0,0,.35);font-size:.9rem;max-width:calc(100% - 32px)}
.foot{font-size:.7rem;color:var(--muted);text-align:center;margin:12px 0 0;line-height:1.5}

#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:hidden;
  background:radial-gradient(120% 80% at 50% 15%,#2a6f78 0%,#0f3a41 55%,#081f24 100%);transition:opacity .6s ease,transform .6s ease}
#splash.out{opacity:0;transform:scale(1.06);pointer-events:none}
#spBg{position:absolute;inset:0;width:100%;height:100%}
.spLogo{position:relative;font-family:var(--display);font-size:clamp(3rem,16vw,5rem);line-height:1;letter-spacing:.02em;color:#ffc23d;text-shadow:0 5px 0 #b37400,0 10px 24px rgba(0,0,0,.45);transform-origin:50% 80%}
.spLogo span{display:inline-block;animation:spDrop .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes spDrop{from{transform:translateY(-120px) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
.spSub{position:relative;font-weight:800;color:#bfe8e3;font-size:.9rem;letter-spacing:.08em;text-transform:uppercase;margin-top:-6px}
#spFarmer{position:relative;width:120px;height:120px;animation:spBob 1.6s ease-in-out infinite}
@keyframes spBob{50%{transform:translateY(-6px)}}
.spBar{position:relative;width:min(260px,70vw);height:14px;border-radius:9px;background:rgba(0,0,0,.35);overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.4)}

<script src="three.min.js"></script>
<script>
/* ================= VUELCO LOGIC v2 — tap groups, specials, combos, chicks, rotate ================= */
const VL=(()=>{
  const NB=[[1,0],[-1,0],[0,1],[0,-1]];
  const rng=seed=>()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const shuffle=(a,r)=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  const FIX=t=>t==='stone'||t==='ice'||t==='choco';
  const SPEC=t=>t==='rocketH'||t==='rocketV'||t==='tnt'||t==='prism';
  const RANK={rocketH:1,rocketV:1,tnt:2,prism:3};

  function build(spec,seed){
    const r=rng(seed),N=spec.N;let id=1;const blocks=[];
    if(spec.layout){/* hand-made board: 0-4 colour, a-e colour+gem, S stone, X crate, P chick, H ice, h ice+gem, T timer, K chocolate, L chained (random colour), . random */
      spec.layout.forEach((row,a)=>[...row].forEach((ch,b)=>{const rc=()=>Math.floor(r()*spec.colors),o={id:id++,r:a,c:b,type:'c'};
        if(ch>='0'&&ch<='4')o.color=+ch;else if(ch>='a'&&ch<='e'){o.color=ch.charCodeAt(0)-97;o.gem=true}else if(ch==='S')o.type='stone';else if(ch==='X')o.type='crate';else if(ch==='P')o.type='duck';
        else if(ch==='H'||ch==='h'){o.type='ice';o.color=rc();if(ch==='h')o.gem=true}else if(ch==='T'){o.type='timer';o.t=spec.timers?spec.timers.t:12}else if(ch==='K')o.type='choco';else if(ch==='L'){o.color=rc();o.chain=true}else if(ch>='q'&&ch<='u'){o.color=ch.charCodeAt(0)-113;o.chain=true}else if(ch>='v'&&ch<='z'){o.type='ice';o.color=ch.charCodeAt(0)-118}else o.color=rc();
        blocks.push(o)}));
      const S={N,colors:spec.colors,blocks,nextId:id,moves:spec.moves||25,start:spec.moves||25,need:Object.assign({},spec.goal||{}),got:{},gemsLeft:blocks.filter(x=>x.gem).length,ducksLeft:blocks.filter(x=>x.type==='duck').length,
        cratesLeft:spec.crateGoal?blocks.filter(x=>x.type==='crate').length:0,chocoLeft:spec.chocoGoal?blocks.filter(x=>x.type==='choco').length:0,result:null,score:0,stats:{pop:0,spec:0,combo:0,gems:0,ducks:0}};
      S.gemsTotal=S.gemsLeft;S.ducksTotal=S.ducksLeft;S.cratesTotal=S.cratesLeft;S.chocoTotal=S.chocoLeft;ensureMove(S,r,[]);return S}
    for(let a=0;a<N;a++)for(let b=0;b<N;b++)blocks.push({id:id++,type:'c',color:Math.floor(r()*spec.colors),r:a,c:b});
    const at=(a,b)=>blocks.find(x=>x.r===a&&x.c===b);
    const ring=[];for(let a=2;a<N-1;a++)for(let b=1;b<N-1;b++)ring.push([a,b]);
    shuffle(ring,r).slice(0,spec.stones||0).forEach(([a,b])=>{const x=at(a,b);x.type='stone';delete x.color});
    const pick=(filter,n)=>shuffle(blocks.filter(filter),r).slice(0,n);
    pick(x=>x.type==='c'&&x.r>=2,spec.ice||0).forEach(x=>x.type='ice');
    pick(x=>x.type==='c'&&x.r>=2,spec.crates||0).forEach(x=>{x.type='crate';delete x.color});
    pick(x=>x.type==='c'&&x.r>=2,spec.timers?spec.timers.n:0).forEach(x=>{x.type='timer';x.t=spec.timers.t;delete x.color});
    pick(x=>x.type==='c'&&x.r>=2,spec.choco||0).forEach(x=>{x.type='choco';if(spec.fire)x.fire=true;delete x.color});
    pick(x=>x.type==='c'&&x.r>=1,spec.chains||0).forEach(x=>x.chain=true);
    pick(x=>x.type==='c'&&x.r<=1&&!x.chain,spec.ducks||0).forEach(x=>{x.type='duck';delete x.color});
    pick(x=>(x.type==='c'||(spec.iceGems&&x.type==='ice'))&&x.r>=1,spec.gems||0).forEach(x=>x.gem=true);
    const S={N,colors:spec.colors,blocks,nextId:id,moves:spec.moves||25,start:spec.moves||25,need:Object.assign({},spec.goal||{}),got:{},
      gemsLeft:blocks.filter(x=>x.gem).length,ducksLeft:blocks.filter(x=>x.type==='duck').length,cratesLeft:spec.crateGoal?blocks.filter(x=>x.type==='crate').length:0,chocoLeft:spec.chocoGoal?blocks.filter(x=>x.type==='choco').length:0,
      result:null,score:0,stats:{pop:0,spec:0,combo:0,gems:0,ducks:0}};
    S.gemsTotal=S.gemsLeft;S.ducksTotal=S.ducksLeft;S.cratesTotal=S.cratesLeft;S.chocoTotal=S.chocoLeft;
    ensureMove(S,r,[]);return S;
  }
  const clone=S=>Object.assign({},S,{blocks:S.blocks.map(b=>Object.assign({},b)),need:Object.assign({},S.need),got:Object.assign({},S.got),stats:Object.assign({},S.stats),rescued:(S.rescued||[]).slice()});
  function occ(S){const g=Array.from({length:S.N},()=>Array(S.N).fill(null));S.blocks.forEach(b=>{g[b.r][b.c]=b});return g}
  function groupOf(S,b,g){g=g||occ(S);if(!b||b.type!=='c')return[];const out=[b],seen=new Set([b.id]);
    for(let i=0;i<out.length;i++){const x=out[i];for(const[dr,dc]of NB){const u=x.r+dr,v=x.c+dc;if(u<0||v<0||u>=S.N||v>=S.N)continue;const n=g[u][v];if(n&&n.type==='c'&&n.color===b.color&&!seen.has(n.id)){seen.add(n.id);out.push(n)}}}
    return out}
  function groups(S){const g=occ(S),seen=new Set(),out=[];S.blocks.forEach(b=>{if(b.type!=='c'||seen.has(b.id))return;const l=groupOf(S,b,g);l.forEach(x=>seen.add(x.id));if(l.length>=2)out.push(l)});return out}
  function hasMove(S){return S.blocks.some(b=>SPEC(b.type))||groups(S).length>0}

  /* ---------- removing things ---------- */
  function kill(S,b,ev){
    S.blocks=S.blocks.filter(x=>x!==b);
    if(b.type==='c'){S.got[b.color]=(S.got[b.color]||0)+1;S.stats.pop++;S.score+=10}
    if(b.gem){S.gemsLeft--;S.stats.gems++;S.score+=50}
    if(b.type==='crate'){if(S.cratesTotal)S.cratesLeft--;S.score+=30}
    if(b.type==='timer')S.score+=40;
    if(b.type==='choco'){if(S.chocoTotal)S.chocoLeft--;S.score+=30;ev.choco=true}
    ev.dead.push({id:b.id,r:b.r,c:b.c,type:b.type,color:b.color,gem:!!b.gem});
  }
  /* a cell hit by an explosion */
  function hit(S,g,r,c,ev,queue){
    if(r<0||c<0||r>=S.N||c>=S.N)return;const b=g[r][c];if(!b||ev.gone.has(b.id))return;
    if(b.type==='stone'||b.type==='duck'||b.type==='animal')return;
    if(b.chain){b.chain=false;ev.unchain.push(b.id);return}
    if(b.type==='ice'){if(!ev.thaw.includes(b.id)){b.type='c';ev.thaw.push(b.id)}return}
    if(SPEC(b.type)){if(!queue.includes(b))queue.push(b);return}
    ev.gone.add(b.id);kill(S,b,ev);
  }
  function neighbourFx(S,g,list,ev){const done=new Set();
    list.forEach(x=>NB.forEach(([dr,dc])=>{const u=x.r+dr,v=x.c+dc;if(u<0||v<0||u>=S.N||v>=S.N)return;const n=g[u][v];if(!n||done.has(n.id)||ev.gone.has(n.id))return;done.add(n.id);
      if(n.type==='ice'&&!ev.thaw.includes(n.id)){n.type='c';ev.thaw.push(n.id)}
      else if(n.type==='crate'||n.type==='timer'||n.type==='choco'){ev.gone.add(n.id);kill(S,n,ev)}}))}
  function mostColor(S){const cnt={};S.blocks.forEach(b=>{if(b.type==='c')cnt[b.color]=(cnt[b.color]||0)+1});let best=0,bc=-1;for(const k in cnt)if(cnt[k]>best){best=cnt[k];bc=+k}return bc}
  /* fire one special (and whatever it sets off) */
  function fire(S,start,rand,ev,comboWith){
    const queue=[start];const g=occ(S);let n=0;
    while(queue.length&&n<60){n++;const sp=queue.shift();if(ev.gone.has(sp.id))continue;ev.gone.add(sp.id);S.blocks=S.blocks.filter(x=>x!==sp);g[sp.r][sp.c]=null;S.stats.spec++;S.score+=60;
      ev.dead.push({id:sp.id,r:sp.r,c:sp.c,type:sp.type});
      let kind=sp.type;if(sp===start&&comboWith)kind=comboKind(sp.type,comboWith.type);
      const R=sp.r,C=sp.c,N=S.N,fx={k:kind,r:R,c:C,cells:[]};ev.fx.push(fx);
      const H=(r,c)=>{fx.cells.push([r,c]);hit(S,g,r,c,ev,queue)};
      if(kind==='rocketH')for(let c=0;c<N;c++)H(R,c);
      else if(kind==='rocketV')for(let r=0;r<N;r++)H(r,C);
      else if(kind==='tnt')for(let r=R-1;r<=R+1;r++)for(let c=C-1;c<=C+1;c++)H(r,c);
      else if(kind==='cross'){for(let c=0;c<N;c++)H(R,c);for(let r=0;r<N;r++)H(r,C)}
      else if(kind==='bigcross'){for(let d=-1;d<=1;d++){for(let c=0;c<N;c++)H(R+d,c);for(let r=0;r<N;r++)H(r,C+d)}}
      else if(kind==='bigtnt')for(let r=R-2;r<=R+2;r++)for(let c=C-2;c<=C+2;c++)H(r,c);
      else if(kind==='prism'){const col=mostColor(S);fx.color=col;S.blocks.filter(b=>b.type==='c'&&b.color===col).forEach(b=>H(b.r,b.c))}
      else if(kind==='prismRocket'||kind==='prismTnt'){const col=mostColor(S);fx.color=col;
        S.blocks.filter(b=>b.type==='c'&&b.color===col).forEach(b=>{b.type=kind==='prismTnt'?'tnt':(rand()<.5?'rocketH':'rocketV');delete b.color;fx.cells.push([b.r,b.c]);queue.push(b)})}
      else if(kind==='nuke'){for(let r=0;r<N;r++)for(let c=0;c<N;c++)H(r,c)}
    }
  }
  function comboKind(a,b){const A=RANK[a],B=RANK[b];const hi=A>=B?a:b,lo=A>=B?b:a;
    if(hi==='prism')return lo==='prism'?'nuke':lo==='tnt'?'prismTnt':'prismRocket';
    if(hi==='tnt')return lo==='tnt'?'bigtnt':'bigcross';return'cross'}

  /* ---------- gravity, refill, chicks ---------- */
  function gravity(S){const g=occ(S),N=S.N;let moved=false;
    for(let c=0;c<N;c++){let next=N-1;for(let r=N-1;r>=0;r--){const b=g[r][c];if(!b)continue;if(FIX(b.type)){next=r-1;continue}if(b.r!==next){b.r=next;moved=true}next--}}return moved}
  function refill(S,rand){const g=occ(S),N=S.N,add=[];
    for(let c=0;c<N;c++){let k=0;for(let r=0;r<N;r++){if(g[r][c])break;k++}
      for(let i=0;i<k;i++){const b={id:S.nextId++,type:'c',color:Math.floor(rand()*S.colors),r:k-1-i,c};S.blocks.push(b);add.push({id:b.id,r:b.r,c,color:b.color,drop:i})}}
    return add}
  function settle(S,rand,steps,fill){
    for(let i=0;i<20;i++){
      gravity(S);steps.push({k:'fall',pos:S.blocks.map(b=>[b.id,b.r,b.c])});
      const out=S.blocks.filter(b=>(b.type==='duck'||b.type==='animal')&&b.r===S.N-1);
      if(out.length){const an=[];out.forEach(b=>{S.blocks=S.blocks.filter(x=>x!==b);if(b.type==='duck'){S.ducksLeft--;S.stats.ducks++;S.score+=100}else{an.push(b.an);S.score+=200;(S.rescued=S.rescued||[]).push(b.an)}});steps.push({k:'duck',ids:out.map(b=>b.id),animals:an});continue}
      if(!fill)break;const add=refill(S,rand);if(!add.length)break;steps.push({k:'spawn',add});
    }
  }
  function ensureMove(S,rand,steps){if(hasMove(S)||S.blocks.length<S.N*S.N)return;
    for(let k=0;k<30&&!hasMove(S);k++)S.blocks.forEach(b=>{if(b.type==='c')b.color=Math.floor(rand()*S.colors)});
    steps.push({k:'shuffle',colors:S.blocks.filter(b=>b.type==='c').map(b=>[b.id,b.color])})}
  const goalsMet=S=>{if(S.gemsLeft>0||S.ducksLeft>0||S.cratesLeft>0||S.chocoLeft>0)return false;for(const k in S.need)if((S.got[k]||0)<S.need[k])return false;return true};
  function finish(S,rand,steps,useMove,fill){
    settle(S,rand,steps,fill);
    if(useMove)S._calm=S._chocoHit?0:(S._calm||0)+1;
    if(useMove&&!S._chocoHit&&S._calm>=2){S._calm=0;const ch=S.blocks.filter(b=>b.type==='choco');if(ch.length){const g=occ(S),opts=[];ch.forEach(b=>NB.forEach(([dr,dc])=>{const u=b.r+dr,v=b.c+dc;if(u<0||v<0||u>=S.N||v>=S.N)return;const n=g[u][v];if(n&&n.type==='c'&&!n.gem&&!n.chain)opts.push([n,b])}));
      if(opts.length){const [n,src]=opts[Math.floor(rand()*opts.length)];n.type='choco';n.fire=!!src.fire;delete n.color;if(S.chocoTotal){S.chocoLeft++;S.chocoTotal++}steps.push({k:'choco',id:n.id})}}}
    S._chocoHit=false;
    if(useMove){S.moves--;let boom=null;S.blocks.forEach(b=>{if(b.type==='timer'){b.t--;if(b.t<=0&&!boom)boom=b.id}});steps.push({k:'tick',boom})
      S.result=goalsMet(S)?'win':boom?'bomb':S.moves<=0?'out':null}
    else S.result=goalsMet(S)?'win':null;
    if(!S.result)ensureMove(S,rand,steps);
    return steps}

  /* ---------- player actions ---------- */
  function tap(S,id,rand){
    const b=S.blocks.find(x=>x.id===id);if(!b)return null;const ev={dead:[],thaw:[],fx:[],unchain:[],gone:new Set(),made:null};const steps=[];
    if(SPEC(b.type)){

const yKey=()=>{const d=new Date();d.setDate(d.getDate()-1);return dayKey(d)};
function fresh(){return{coins:150,lives:5,nextLife:0,level:1,stars:{},spent:0,boost:{hammer:0,bomb:0,turns:0},chestBar:0,chests:[],town:{area:0,built:[]},
  gift:{last:null,streak:0},wheel:{day:null,free:true,extra:0},mis:{day:null,list:[]},vids:{day:null,n:0},daily:{day:null,done:false,tries:0,streak:0,last:null},
  flags:{},settings:{sound:true,music:true,vib:true},inv:{owned:[],eq:'clasico'},deal:{day:null,id:null},stats:{wins:0},prod:{},infUntil:0,log:[],streak:0,farm:{a:{},last:0,slots:0},townV:3,ev:{wk:null,prog:0,got:[]},created:Date.now()}}
function parseSave(d){if(!d||typeof d!=='object')return null;const f=fresh();return Object.assign(f,d,{boost:Object.assign(f.boost,d.boost||{}),inv:Object.assign(f.inv,d.inv||{}),town:Object.assign(f.town,d.town||{}),farm:Object.assign(f.farm,d.farm||{}),prod:d.prod||{},settings:Object.assign(f.settings,d.settings||{}),ev:Object.assign(f.ev,d.ev||{})})}

const save=()=>{D.savedAt=Date.now();const txt=JSON.stringify(D);try{localStorage.setItem(KEY,txt)}catch(e){}
  if(NATIVE&&CP.Preferences)CP.Preferences.set({key:KEY,value:txt}).catch(()=>{});Cloud.dirty()};
/* native storage survives better than the web view's storage: load it on start if it is newer */
async function loadNativeSave(){if(!NATIVE||!CP.Preferences)return;try{const r=await CP.Preferences.get({key:KEY});const d=r&&r.value&&parseSave(JSON.parse(r.value));if(d&&(d.savedAt||0)>(D.savedAt||0)){D=d;try{localStorage.setItem(KEY,r.value)}catch(e){}}}catch(e){}}
/* ---------- cloud save: Google sign-in (Firebase Authentication plugin) + Firestore REST ---------- */
const Cloud={user:null,last:0,t:0,busy:false,
  ok(){return NATIVE&&!!CP.FirebaseAuthentication&&!!CFG.firebaseProjectId},
  url(){return`https://firestore.googleapis.com/v1/projects/${CFG.firebaseProjectId}/databases/(default)/documents/saves/${this.user.uid}`},
  async token(){const r=await CP.FirebaseAuthentication.getIdToken({forceRefresh:false});return r.token},
  async init(){if(!this.ok())return;try{const r=await CP.FirebaseAuthentication.getCurrentUser();this.user=r&&r.user||null;if(this.user)await this.pull(true)}catch(e){}},
  async signIn(){if(!this.ok())return toast('El guardado en la nube estará disponible en la app');try{const r=await CP.FirebaseAuthentication.signInWithGoogle();this.user=r.user;toast('Sesión iniciada: '+(this.user.email||''));await this.pull(false)}catch(e){toast('No se ha podido iniciar sesión')}},
  async signOut(){try{await this.push();await CP.FirebaseAuthentication.signOut()}catch(e){}this.user=null;toast('Sesión cerrada. Tu partida sigue en este móvil.')},
  async pull(silent){if(!this.user)return;try{const res=await fetch(this.url(),{headers:{Authorization:'Bearer '+await this.token()}});
      if(res.status===404)return this.push();if(!res.ok)return;const j=await res.json();const remote=parseSave(JSON.parse(j.fields.data.stringValue));if(!remote)return;
      const lp=(D.level||1)*1000+totalStars(),rp=(remote.level||1)*1000+Object.values(remote.stars||{}).reduce((a,b)=>a+b,0);
      if((remote.savedAt||0)<=(D.savedAt||0)&&rp<=lp)return this.push();
      if(rp===lp||silent&&rp>lp&&!D.flags.welcome){this.use(remote);return}
      modal(`<h2>Partida en la nube</h2><p>En la nube tienes una partida en el <b style="color:var(--chalk)">nivel ${remote.level}</b>; en este móvil estás en el <b style="color:var(--chalk)">nivel ${D.level}</b>. ¿Con cuál te quedas?</p>`,[
        {label:`La de la nube (nivel ${remote.level})`,cls:'b-pri',fn:()=>{closeModal();this.use(remote)}},{label:`La de este móvil (nivel ${D.level})`,cls:'b-sec',fn:()=>{closeModal();this.push()}}])}catch(e){}},
  use(remote){D=remote;try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}if(NATIVE&&CP.Preferences)CP.Preferences.set({key:KEY,value:JSON.stringify(D)}).catch(()=>{});toast('Partida recuperada de la nube');if(typeof refresh==='function')refresh()},
  async push(){if(!this.user||this.busy)return;this.busy=true;try{await fetch(this.url(),{method:'PATCH',headers:{Authorization:'Bearer '+await this.token(),'Content-Type':'application/json'},
      body:JSON.stringify({fields:{data:{stringValue:JSON.stringify(D)},savedAt:{integerValue:String(D.savedAt||Date.now())},level:{integerValue:String(D.level||1)}}})});this.last=Date.now()}catch(e){}this.busy=false},
  dirty(){if(!this.user)return;clearTimeout(this.t);this.t=setTimeout(()=>this.push(),15000)}};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&Cloud.user)Cloud.push()});
function logPlay(o){D.log.push(Object.assign({d:Date.now()},o));if(D.log.length>400)D.log.splice(0,D.log.length-400);save()}
const EVENTS=[{k:'ducks',goal:40,n:'Rescate de pollitos',t:'Rescata pollitos',deco:'estatua'},{k:'made',goal:30,n:'Semana de especiales',t:'Crea especiales',deco:'globo'},{k:'gems',goal:60,n:'Fiebre de gemas',t:'Libera gemas',deco:'noria'}];
const weekNo=()=>Math.floor((Date.now()/864e5+3)/7);
const weekEnd=()=>((weekNo()+1)*7-3)*864e5-Date.now();
function evNow(){const wk=weekNo();if(D.ev.wk!==wk)D.ev={wk,prog:0,got:[]};const E0=EVENTS[wk%EVENTS.length];return Object.assign({},E0,{prog:D.ev.prog,got:D.ev.got})}
const EV_TIERS=[{at:1/3,r:60},{at:2/3,r:'chest:plata'},{at:1,r:'deco'}];
const totalStars=()=>Object.values(D.stars).reduce((a,b)=>a+b,0);
const freeStars=()=>totalStars()-D.spent;

/* ---------- economy ---------- */
const E={maxLives:5,regen:30*60e3,refill:150,revive:[90,180],video:20,videoMax:8,
  win:(L,st)=>6+Math.floor((L-1)/10)*2+st*3,price:{hammer:90,bomb:140,turns:110},
  chestEvery:12,shopChest:{plata:300,oro:700,magico:1500},
  gift:[25,'b:hammer',40,'b:turns',60,'b:bomb','chest:oro'],
  wheel:[{v:20,w:20,c:'#ff6b5b'},{b:'hammer',w:10,c:'#56a9ff'},{v:10,w:24,c:'#3fd6a2'},{v:50,w:7,c:'#b57bff'},{b:'bomb',w:6,c:'#ff9f43'},{v:5,w:20,c:'#20c997'},{b:'turns',w:9,c:'#f06595'},{v:100,w:4,c:'#ffc23d'}],
  wheelExtra:2,boostAt:{hammer:5,bomb:8,turns:12}};
const BNAME={hammer:'Martillo',bomb:'Bomba de color',turns:'+3 movimientos'};
const BDESC={hammer:'Rompe el bloque que toques (o lanza un especial) sin gastar movimiento.',bomb:'Explota todos los bloques de un color.',turns:'Suma 3 movimientos a la partida.'};
const perksBuilt=()=>{const out=[];AREAS.forEach(A=>A.items.forEach(it=>{if(D.town.built.includes(it.id))out.push(it)}));DECO.forEach(it=>{if(D.town.built.includes(it.id))out.push(it)});return out};
const maxLives=()=>Math.min(8,E.maxLives+perksBuilt().filter(it=>it.p.t==='max').length);
const regenMs=()=>Math.max(20,30-perksBuilt().filter(it=>it.p.t==='regen').reduce((a,it)=>a+it.p.v,0))*60e3;
const infinite=()=>Date.now()<(D.infUntil||0);
function regen(){const M=maxLives();if(D.lives>=M){D.nextLife=0;return}if(!D.nextLife)D.nextLife=Date.now()+regenMs();while(D.lives<M&&Date.now()>=D.nextLife){D.lives++;D.nextLife+=regenMs()}if(D.lives>=M)D.nextLife=0}
function useLife(){if(infinite())return;regen();D.lives=Math.max(0,D.lives-1);if(!D.nextLife&&D.lives<maxLives())D.nextLife=Date.now()+regenMs();save();status()}
function addCoins(n,why,quiet){D.coins+=n;save();status();if(n>0&&!quiet){SFX.coin();toast(`+${n} monedas${why?' · '+why:''}`)}}
function spend(n){if(D.coins<n)return false;D.coins-=n;save();status();return true}
function videosLeft(){if(D.vids.day!==dayKey())D.vids={day:dayKey(),n:0};return E.videoMax-D.vids.n}
function payReward(r,why){if(typeof r==='number')return addCoins(r,why);const[k,v]=r.split(':');if(k==='chest')return grantChest(v,why);if(k==='b'){D.boost[v]++;save();SFX.cheer();toast(`+1 ${BNAME[v]}${why?' · '+why:''}`)}}
const rewardHTML=r=>{if(typeof r==='number')return`${I.coin}${r}`;const[k,v]=r.split(':');return k==='chest'?CHESTS[v].n:`${BNAME[v]}`};

  modal(`<div class="big" style="color:var(--heart)">${I.heart.replace('18','40').replace('18','40')} ${inf?'∞':D.lives}</div><h2>${inf?'Vidas infinitas':D.lives?'Vidas':'Sin vidas'}</h2><p>${inf?`Juega sin gastar vidas durante ${mmss(D.infUntil-Date.now())}.`:`Cada partida gasta 1 vida. Máximo ${M}. ${D.lives>=M?'Las tienes todas.':`Recuperas una cada ${Math.round(regenMs()/60e3)} min; la siguiente, en ${mmss(D.nextLife-Date.now())}.`}`}</p>
    <p style="font-size:.85rem">Tu pueblo te da más vidas: edificios que suben el máximo, que recargan más rápido y que te regalan vidas cada pocas horas.</p>`,[
    !inf?{label:I.play+'Anuncio: +1 vida',cls:'b-ad',fn:()=>{closeModal();showAd('rewarded',()=>{D.lives++;regen();save();status();toast(I.heart+' +1 vida');cb&&cb()})}}:null,

function renderMap(){
  const box=$('#t-map');let h='';const top=Math.min(D.level,LAST);
  if(isOpen('event')){const e=evNow();h+=`<button class="evban" id="mEv" type="button"><b>${e.n}</b><small>${e.t}: ${e.prog}/${e.goal} · termina en ${mmss(weekEnd())}</small><span class="pb"><i style="width:${Math.round(e.prog/e.goal*100)}%"></i></span></button>`}
  else if(D.level>=UL.event-5)h+=`<p class="foot" style="margin:6px 0">Eventos semanales desde el nivel ${UL.event}</p>`;
  if(D.streak)h+=`<p class="foot" style="color:var(--gold);font-weight:800;margin:4px 0">🔥 Racha: ${D.streak}${streakGift(D.streak).length?' · empiezas con especiales':''}</p>`;
  CHAPTERS.forEach((ch,ci)=>{const first=ci*10+1,open=D.level>=first,st=[...Array(10)].reduce((a,_,k)=>a+(D.stars[first+k]||0),0);
    h+=`<div class="chap" style="border-color:${open?ch.c:'var(--line)'}"><div><span class="num">Capítulo ${ci+1}</span><br><b style="color:${open?ch.c:'var(--muted)'}">${ch.n}</b></div><span>${open?`${I.star} ${st}/30`:'🔒 Nivel '+first}</span></div><div class="path">`;
    for(let k=0;k<10;k++){const L=first+k,x=[0,56,84,56,0,-56,-84,-56,0,56][k],s=D.stars[L]||0,cls=L<top||(L===top&&s)?'done':L===top?'cur':'';
      const boss=k===9,locked=L>D.level;
      h+=`<button class="node ${cls} ${boss?'boss':''}" data-l="${L}" type="button" style="transform:translateX(${x}px)" ${locked?'aria-disabled="true"':''} aria-label="Nivel ${L}">${L}${boss?'<span class="tag">JEFE</span>':''}${s?`<span class="ns">${[0,1,2].map(i=>`<svg viewBox="0 0 24 24" class="${i<s?'on':''}"><path fill="currentColor" d="${STAR}"/></svg>`).join('')}</span>`:''}</button>`}
    h+='</div>'});
  h+='<p class="foot">Más capítulos muy pronto · Prototipo con anuncios simulados</p>';
  box.innerHTML=h;
  const me=$('#mEv');if(me)me.onclick=()=>{Sound.init();eventModal()};
  box.querySelectorAll('.node').forEach(n=>n.onclick=()=>{Sound.init();SFX.tap();const L=+n.dataset.l;if(L>D.level){toast('Supera el nivel '+D.level+' primero');return}preLevel(L)});

    ['Construyendo el valle…',()=>{let t=0;return new Promise(r=>{const ck=()=>{if(typeof THREE!=='undefined'||t>25)return r();t++;setTimeout(ck,80)};ck()})}],
    ['Despertando a los animales…',()=>wait(300)],
  ];
  const t0=performance.now();
  (async()=>{for(let i=0;i<steps.length;i++){txt.textContent=steps[i][0];await steps[i][1]();fill.style.width=Math.round((i+1)/steps.length*100)+'%'}
    const rest=1800-(performance.now()-t0);if(rest>0)await wait(rest);
    txt.textContent=D.flags.welcome?`¡Hola de nuevo! Nivel ${Math.min(D.level,LAST)} · ${freeStars()} ★`:'¡Todo listo!';go.hidden=false;go.focus()})();
  go.onclick=()=>{Sound.init();SFX.win();if(D.settings.music)Music.start();sp.classList.add('out');const wasNew=!D.flags.welcome;boot();if(!wasNew&&Date.now()-(D.disLast||0)>8*36e5&&Math.random()<.4)setTimeout(()=>{if($('#modal').hidden&&$('#play').hidden)maybeDisaster(null,true)},1400);setTimeout(()=>{alive=false;cancelAnimationFrame(raf);sp.remove()},650)};
})();

</script>

<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
